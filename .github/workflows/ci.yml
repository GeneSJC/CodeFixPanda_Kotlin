name: CI

# Runs on every push and pull request against develop/main — this is what
# actually catches a real compile error (like the platform declaration
# clash from v0.51, or the Modifier.padding overload mismatch from the
# rate-limit indicator work) before it lands, rather than relying on
# manual review or a local build alone. GitHub's own runners have normal
# internet access, so the Gradle toolchain download that's blocked in the
# Claude Code sandbox works fine here.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the JDK Gradle itself launches under — the project's own
      # compile toolchain (a newer JDK, resolved via the foojay plugin in
      # settings.gradle.kts) is downloaded separately by Gradle at build
      # time, same as it would be on a real machine with network access.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        # Both flavors are named: with two flavors the bare name testDebugUnitTest is ambiguous to Gradle.
        run: ./gradlew testFossDebugUnitTest testCommercialDebugUnitTest --stacktrace

      - name: Compile (debug)
        run: ./gradlew assembleFossDebug assembleCommercialDebug --stacktrace

      # Proves neither flavor contains advertising software (ads are parked; see docs/ads/README.md).
      # See scripts/check-no-ads-sdk.sh.
      - name: Builds contain no ads software
        run: ./scripts/check-no-ads-sdk.sh

      # Proves no release build contains a developer's GitHub token, and that the check can tell (the debug
      # builds must contain it). See scripts/check-release-has-no-token.sh.
      - name: Release builds contain no developer token
        run: ./scripts/check-release-has-no-token.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          retention-days: 14
